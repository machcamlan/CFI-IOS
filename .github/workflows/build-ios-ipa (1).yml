name: Build CFI iOS IPA

# Builds an UNSIGNED .ipa on a macOS runner so the app can be sideloaded with
# iLoader, AltStore, Sideloadly or similar. No Apple account, no certificate and
# no Mac of your own is required to produce the file.
#
# The artifact is unsigned on purpose: sideloading tools re-sign it on device
# with your own free Apple ID. Never commit a signing certificate to this repo.

on:
  push:
    branches: [main]
    paths:
      - '**/project.yml'
      - '**/*.swift'
      - '.github/workflows/build-ios-ipa.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag. If set, the IPA is attached to a GitHub Release for easy download on iPhone.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: cfi-ios-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      # Uploading through the GitHub web UI can nest the project one level deeper
      # than expected, so the build locates project.yml instead of assuming ./ios.
      - name: Locate the Xcode project spec
        id: locate
        run: |
          echo "Repository layout:"
          find . -maxdepth 3 -not -path './.git/*' -not -name '.' | sort | head -60
          echo

          SPEC=$(find . -name project.yml -not -path './.git/*' | head -1)

          # Fallback: the GitHub web UI uploads a zip as a file, it does not
          # unpack it. If the sources only exist inside an archive, unpack it here
          # so the build can proceed.
          if [ -z "$SPEC" ]; then
            for ZIP in $(find . -name '*.zip' -not -path './.git/*'); do
              if unzip -l "$ZIP" 2>/dev/null | grep -q 'project\.yml'; then
                echo "No loose sources found. Unpacking $ZIP"
                rm -rf .unpacked && mkdir -p .unpacked
                unzip -q "$ZIP" -d .unpacked
                SPEC=$(find .unpacked -name project.yml | head -1)
                break
              fi
            done
          fi

          if [ -z "$SPEC" ]; then
            echo "::error::No project.yml anywhere in this repository."
            echo "The ios/ folder was not uploaded. Push with git, or extract the zip"
            echo "first and upload its contents so that ios/ and .github/ sit at the"
            echo "repository root rather than inside a wrapper folder."
            exit 1
          fi

          DIR=$(dirname "$SPEC")
          echo "Found spec at $SPEC"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          if [ ! -d "$DIR/CFI/Sources" ]; then
            echo "::error::Found $SPEC but $DIR/CFI/Sources is missing."
            echo "The Swift sources did not upload. Folder structure must be preserved."
            exit 1
          fi

          COUNT=$(find "$DIR/CFI/Sources" -name '*.swift' | wc -l | tr -d ' ')
          echo "Swift files: $COUNT"
          if [ "$COUNT" -lt 4 ]; then
            echo "::error::Only $COUNT Swift files found, expected 4."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          xcodegen generate
          ls -la

      - name: Build unsigned archive
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CFI.xcodeproj \
            -scheme CFI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/CFI.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package into an IPA
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          APP="build/CFI.xcarchive/Products/Applications/CFI.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Build produced no .app — nothing to package."
            find build -maxdepth 4 -name "*.app" || true
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry CFI-unsigned.ipa Payload
          ls -lh CFI-unsigned.ipa

      - name: Verify the IPA structure
        working-directory: ${{ steps.locate.outputs.dir }}/build
        run: |
          unzip -l CFI-unsigned.ipa | head -20
          unzip -l CFI-unsigned.ipa | grep -q "Payload/CFI.app/CFI" || {
            echo "::error::IPA is missing its executable."
            exit 1
          }
          echo "IPA looks well formed."

      - uses: actions/upload-artifact@v4
        with:
          name: CFI-unsigned-ipa
          path: ${{ steps.locate.outputs.dir }}/build/CFI-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Attach to a release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: CFI iOS ${{ inputs.release_tag }}
          files: ${{ steps.locate.outputs.dir }}/build/CFI-unsigned.ipa
          body: |
            Unsigned IPA for sideloading with iLoader, AltStore or Sideloadly.

            Install it with your own free Apple ID; the tool signs it on device.
            An app signed with a free account expires after 7 days and needs
            reinstalling. A paid developer account extends that to a year.
